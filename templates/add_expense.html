{% extends "base.html" %}

{% block content %}

<h2 class="mt-4">Add Expense</h2>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Expense Title</label>

        <input
            type="text"
            name="title"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Amount</label>

        <input
            type="number"
            name="amount"
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>

        <select
            name="category"
            class="form-select">

            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Education</option>

        </select>
    </div>

    <button
        type="submit"
        class="btn btn-primary">

        Add Expense

    </button>

</form>

{% endblock %}
