{% extends "base.html" %}

{% block content %}

<h2 class="mt-4">Edit Expense</h2>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">
            Expense Title
        </label>

        <input
            type="text"
            name="title"
            class="form-control"
            value="{{ expense.title }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">
            Amount
        </label>

        <input
            type="number"
            name="amount"
            class="form-control"
            value="{{ expense.amount }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">
            Category
        </label>

        <select
            name="category"
            class="form-select">

            <option {% if expense.category == 'Food' %}selected{% endif %}>Food</option>

            <option {% if expense.category == 'Travel' %}selected{% endif %}>Travel</option>

            <option {% if expense.category == 'Shopping' %}selected{% endif %}>Shopping</option>

            <option {% if expense.category == 'Education' %}selected{% endif %}>Education</option>

        </select>

    </div>

    <button
        type="submit"
        class="btn btn-primary">

        Update Expense

    </button>

</form>

{% endblock %}
