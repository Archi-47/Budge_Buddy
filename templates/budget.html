{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <h2 class="mt-4 fw-bold">
        Monthly Budget
    </h2>

    <p class="text-muted">
        Set your monthly spending limit
    </p>

    <div class="card shadow-sm mt-4">

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Budget Amount
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="amount"
                        class="form-control"
                        required
                        value="{% if budget %}{{ budget.amount }}{% endif %}">

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Save Budget

                </button>

            </form>

        </div>

    </div>

    {% if budget %}

    <div class="card shadow-sm mt-4">

        <div class="card-body">

            <h4>
                Current Budget
            </h4>

            <h2>
                ₹{{ budget.amount }}
            </h2>

        </div>

    </div>

    {% endif %}

</div>

{% endblock %}
